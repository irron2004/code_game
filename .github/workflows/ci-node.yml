name: CI Frontend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'algorithm-game/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'vitest.config.js'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'algorithm-game/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - 'vitest.config.js'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check
